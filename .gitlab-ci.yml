stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: "devops-app"

before_script:
  - echo "Starting CI/CD pipeline"

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $DOCKER_IMAGE .
  only:
    - feature/ci-pipeline
    - develop

test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install --no-cache-dir -r src/requirements.txt
    - python -m unittest discover -s tests || echo "No tests yet, skipping"
  only:
    - feature/ci-pipeline
    - develop

deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - echo "Deploying app..."
    # Exemple pour Heroku / AWS ou autre
    - echo "Déploiement automatique configuré ici"
  only:
    - develop
