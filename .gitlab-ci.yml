stages:
  - build
  - test
  - deploy

variables:
  DOCKER_TLS_CERTDIR: ""

image: docker:26

services:
  - docker:26-dind

before_script:
  - docker info

build:
  stage: build
  script:
    - docker build -t devops-app .
  artifacts:
    expire_in: 1 hour
    paths:
      - Dockerfile

test:
  stage: test
  image: python:3.11
  before_script:
    - pip install -r src/requirements.txt
    - pip install pytest pytest-cov
  script:
    - pytest --cov=src tests/
  artifacts:
    reports:
      junit: report.xml
    expire_in: 1 hour

deploy:
  stage: deploy
  script:
    - echo "Deploying application..."
    - echo "Deployment successful"
  only:
    - develop
