stages:
  - build
  - test
  - deploy

variables:
  DOCKER_IMAGE: "devops-app"

# Avant chaque job, on peut afficher un message
before_script:
  - echo "Starting CI/CD pipeline"

# ------------------------
# Job BUILD
# ------------------------
build:
  stage: build
  image: docker:24.0.5                  # ⚡ version Docker compatible avec dind
  services:
    - docker:24.0.5-dind               # ⚡ Docker-in-Docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"       # obligatoire pour dind
  script:
    - docker info
    - docker build -t $DOCKER_IMAGE .
  only:
    - feature/ci-pipeline
    - develop

# ------------------------
# Job TEST
# ------------------------
test:
  stage: test
  image: python:3.11-slim
  script:
    - pip install --no-cache-dir -r src/requirements.txt
    - python -m unittest discover -s tests || echo "No tests yet, skipping"
  only:
    - feature/ci-pipeline
    - develop

# ------------------------
# Job DEPLOY
# ------------------------
deploy:
  stage: deploy
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "Deploying app..."
    # ⚡ Ici tu peux ajouter tes commandes réelles de déploiement (Heroku, AWS, etc.)
  only:
    - develop
